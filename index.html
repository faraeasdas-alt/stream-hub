
<!DOCTYPE html>
<html lang="ru">

<title>Aleksandr Merkyriev | Stream Hub</title>

<style>
* { box-sizing: border-box; }

body {

    padding: 24px 18px;
    background: #100b1c;

    padding: 22px 16px;

}

.button {

    margin-top: 15px;
    border-radius: 13px;
    background: #9146ff;

    text-decoration: none;
    font-weight: bold;

.tiktok { background: #292331; }

.day {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #49315e;
}

.time { color: #c49aff; }

.footer {
    color: #806b9c;
    font-size: 12px;

<body>
